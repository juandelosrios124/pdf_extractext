services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Sin "ports": con varias réplicas no pueden publicar el mismo puerto del host.
  extract:
    build: ./extract_service
    expose:
      - "8001"
    environment:
      PORT: 8001
      MAX_UPLOAD_SIZE: ${EXTRACT_MAX_UPLOAD_SIZE:-52428800}
      THREAD_POOL_SIZE: ${EXTRACT_THREAD_POOL_SIZE:-4}
      LOG_LEVEL: ${EXTRACT_LOG_LEVEL:-INFO}
    deploy:
      replicas: ${EXTRACT_REPLICAS:-5}
      resources:
        limits:
          cpus: "${EXTRACT_CPUS:-1.0}"
          memory: ${EXTRACT_MEMORY:-1g}

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data:
  ollama_data: